
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Terrain Designer</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 12px;
    background: #20242a;
    color: white;
    font-family: Arial, sans-serif;
  }

  h2 {
    font-size: 18px;
    margin: 4px 0 12px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  button {
    border: 0;
    border-radius: 7px;
    padding: 10px 13px;
    background: #414b58;
    color: white;
    font-size: 14px;
  }

  #viewport {
    width: 100%;
    height: 72vh;
    overflow: auto;
    border: 1px solid #59616c;
    border-radius: 8px;
    background: #15191e;
    touch-action: pan-x pan-y;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }

  #map {
    width: 768px;
    height: 768px;
  }

  #map canvas {
    display: block;
    width: 768px;
    height: 768px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
    font-size: 12px;
    color: #d4d8df;
  }

  .legend span {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }

  #info {
    color: #aeb7c2;
    font-size: 12px;
    margin-top: 10px;
  }
</style>
</head>

<body>

<h2>Terrain Designer — тест границ</h2>

<div class="controls">
  <button id="generate">Новая карта</button>
  <button id="grid">Показать сетку</button>
</div>

<div id="viewport">
  <div id="map"></div>
</div>

<div class="legend">
  <span><i class="dot" style="background:#79ae58"></i>Трава</span>
  <span><i class="dot" style="background:#a8794e"></i>Земля</span>
  <span><i class="dot" style="background:#e5c982"></i>Песок</span>
  <span><i class="dot" style="background:#e5edf1"></i>Снег</span>
</div>

<div id="info">32 × 32 клетки · Можно прокручивать карту пальцем</div>

<script type="module">
import * as PIXI from 'https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.mjs';

// --------------------------------------------------
// НАСТРОЙКИ
// --------------------------------------------------

const CELLS = 32;
const CELL = 24;
const SIZE = CELLS * CELL;

const COLORS = [
  [121, 174, 88],  // grass
  [168, 121, 78],  // earth
  [229, 201, 130], // sand
  [229, 237, 241]  // snow
];

const NAMES = ['Трава', 'Земля', 'Песок', 'Снег'];

let seed = 73521;
let showGrid = false;

const mapElement = document.getElementById('map');

const app = new PIXI.Application();

await app.init({
  width: SIZE,
  height: SIZE,
  background: '#79ae58',
  antialias: true,
  preference: 'webgl'
});

mapElement.appendChild(app.canvas);

// --------------------------------------------------
// ДЕТЕРМИНИРОВАННЫЙ ШУМ
// --------------------------------------------------

function hash(x, y, s = 0) {
  let n = Math.sin(
    x * 127.1 + y * 311.7 + s * 74.7 + seed
  ) * 43758.5453;

  return n - Math.floor(n);
}

function smooth(t) {
  return t * t * (3 - 2 * t);
}

function noise(x, y, s = 0) {
  const ix = Math.floor(x);
  const iy = Math.floor(y);

  const fx = smooth(x - ix);
  const fy = smooth(y - iy);

  const a = hash(ix, iy, s);
  const b = hash(ix + 1, iy, s);
  const c = hash(ix, iy + 1, s);
  const d = hash(ix + 1, iy + 1, s);

  const top = a + (b - a) * fx;
  const bottom = c + (d - c) * fx;

  return top + (bottom - top) * fy;
}

// --------------------------------------------------
// ТЕСТОВАЯ КАРТА ТИПОВ ПОВЕРХНОСТИ
// --------------------------------------------------

let terrain = [];

function generateTerrain() {
  terrain = [];

  for (let y = 0; y < CELLS; y++) {
    const row = [];

    for (let x = 0; x < CELLS; x++) {
      const large = noise(x / 9, y / 9, 1);
      const medium = noise(x / 4.5, y / 4.5, 2);
      const detail = noise(x / 2.5, y / 2.5, 3);

      const value = large * 0.65 + medium * 0.25 + detail * 0.1;

      let type;

      if (value < 0.27) type = 1;
      else if (value < 0.49) type = 2;
      else if (value < 0.75) type = 0;
      else type = 3;

      row.push(type);
    }

    terrain.push(row);
  }
}

// --------------------------------------------------
// ПОЛЯ ПРИНАДЛЕЖНОСТИ ПОВЕРХНОСТЕЙ
// Анализируем окрестность 5x5 клеток
// --------------------------------------------------

const RADIUS = 2;
const scores = [];

function buildFields() {
  for (let type = 0; type < 4; type++) {
    const field = Array.from(
      { length: CELLS },
      () => Array(CELLS).fill(0)
    );

    for (let y = 0; y < CELLS; y++) {
      for (let x = 0; x < CELLS; x++) {
        let total = 0;
        let weightTotal = 0;

        for (let dy = -RADIUS; dy <= RADIUS; dy++) {
          for (let dx = -RADIUS; dx <= RADIUS; dx++) {
            const nx = x + dx;
            const ny = y + dy;

            if (
              nx < 0 || ny < 0 ||
              nx >= CELLS || ny >= CELLS
            ) continue;

            const distance = Math.sqrt(dx * dx + dy * dy);

            const weight = Math.exp(
              -(distance * distance) / 2.2
            );

            if (terrain[ny][nx] === type) {
              total += weight;
            }

            weightTotal += weight;
          }
        }

        field[y][x] = total / weightTotal;
      }
    }

    scores[type] = field;
  }
}

// --------------------------------------------------
// ИНТЕРПОЛЯЦИЯ ПОЛЯ
// --------------------------------------------------

function sampleField(field, x, y) {
  const gx = x / CELL - 0.5;
  const gy = y / CELL - 0.5;

  const x0 = Math.floor(gx);
  const y0 = Math.floor(gy);

  const fx = gx - x0;
  const fy = gy - y0;

  function get(ix, iy) {
    ix = Math.max(0, Math.min(CELLS - 1, ix));
    iy = Math.max(0, Math.min(CELLS - 1, iy));
    return field[iy][ix];
  }

  const a = get(x0, y0);
  const b = get(x0 + 1, y0);
  const c = get(x0, y0 + 1);
  const d = get(x0 + 1, y0 + 1);

  const top = a + (b - a) * fx;
  const bottom = c + (d - c) * fx;

  return top + (bottom - top) * fy;
}

// --------------------------------------------------
// РИСОВАНИЕ ПОВЕРХНОСТИ
// --------------------------------------------------

const canvas = document.createElement('canvas');
canvas.width = SIZE;
canvas.height = SIZE;

const ctx = canvas.getContext('2d', {
  alpha: false
});

const image = ctx.createImageData(SIZE, SIZE);

function renderTerrain() {
  const data = image.data;

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      let bestType = 0;
      let bestScore = -Infinity;

      for (let type = 0; type < 4; type++) {
        let score = sampleField(scores[type], x, y);

        // Низкочастотное искажение контура.
        // У каждого типа свой детерминированный шум.
        const warp = noise(
          x / 78 + type * 4.17,
          y / 78 + type * 2.83,
          type + 10
        );

        score += (warp - 0.5) * 0.13;

        if (score > bestScore) {
          bestScore = score;
          bestType = type;
        }
      }

      const color = COLORS[bestType];
      const i = (y * SIZE + x) * 4;

      data[i] = color[0];
      data[i + 1] = color[1];
      data[i + 2] = color[2];
      data[i + 3] = 255;
    }
  }

  ctx.putImageData(image, 0, 0);

  drawGrid();

  terrainTexture.source.update();
}

// --------------------------------------------------
// ЛОГИЧЕСКАЯ СЕТКА — ТОЛЬКО ДЛЯ ПРОВЕРКИ
// --------------------------------------------------

function drawGrid() {
  if (!showGrid) return;

  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.22)';
  ctx.lineWidth = 1;

  for (let i = 0; i <= CELLS; i++) {
    const p = i * CELL + 0.5;

    ctx.beginPath();
    ctx.moveTo(p, 0);
    ctx.lineTo(p, SIZE);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, p);
    ctx.lineTo(SIZE, p);
    ctx.stroke();
  }

  ctx.restore();
}

// --------------------------------------------------
// PIXI TEXTURE
// --------------------------------------------------

const terrainTexture = PIXI.Texture.from(canvas);

const sprite = new PIXI.Sprite(terrainTexture);
app.stage.addChild(sprite);

// --------------------------------------------------
// ЗАПУСК
// --------------------------------------------------

function generate() {
  generateTerrain();
  buildFields();
  renderTerrain();
}

generate();

document.getElementById('generate').onclick = () => {
  seed += 137;
  generate();
};

document.getElementById('grid').onclick = () => {
  showGrid = !showGrid;
  renderTerrain();

  document.getElementById('grid').textContent =
    showGrid ? 'Скрыть сетку' : 'Показать сетку';
};

</script>
</body>
</html>
