
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain Textures — PixiJS 8</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #26352c;
  color: #f1f4e9;
  font-family: Arial, sans-serif;
}

h2 {
  margin: 4px 0 16px;
  font-size: 20px;
}

#controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 16px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 11px 18px;
  background: #d5b878;
  color: #283329;
  font-weight: bold;
  cursor: pointer;
}

label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 14px;
}

#game {
  width: min(92vw, 768px);
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 8px;
  background: #6f9e59;
  box-shadow: 0 8px 30px #0005;
}

#game canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#status {
  margin-top: 12px;
  font-size: 12px;
  color: #b8c8b6;
}
</style>
</head>

<body>

<h2>Terrain Textures</h2>

<div id="controls">
  <button id="generate">Перерисовать</button>
  <label>
    <input type="checkbox" id="showGrid">
    Показать сетку
  </label>
</div>

<div id="game"></div>
<div id="status">Инициализация...</div>

<script type="module">
import * as PIXI from
  'https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.mjs';

// ==================================================
// 1. НАСТРОЙКИ
// ==================================================

const CELLS = 32;
const CELL_SIZE = 24;
const SIZE = CELLS * CELL_SIZE;

const WORLD_ORIGIN_X = 0;
const WORLD_ORIGIN_Y = 0;

const WORLD_SEED = 73521;

// Размер бесшовной текстуры биома.
const TILE_SIZE = 128;

// Ширина перехода между территориями.
const BLEND_WIDTH = 5;

// Сила искривления границ.
const WARP_STRENGTH = 9;

const TERRAIN = {
  WATER: 0,
  SAND: 1,
  GRASS: 2,
  SHRUB: 3,
  FOREST: 4,
  MOUNTAIN: 5
};

const TERRAIN_NAMES = [
  'Вода',
  'Песок',
  'Луг',
  'Кустарник',
  'Лес',
  'Горы'
];

// ==================================================
// 2. ДЕТЕРМИНИРОВАННЫЕ ФУНКЦИИ
// ==================================================

function hash(x, y, seed) {
  const n = Math.sin(
    x * 127.1 +
    y * 311.7 +
    seed * 74.7
  ) * 43758.5453;

  return n - Math.floor(n);
}

function smooth(t) {
  return t * t * (3 - 2 * t);
}

function noise(x, y, seed) {
  const ix = Math.floor(x);
  const iy = Math.floor(y);

  const fx = x - ix;
  const fy = y - iy;

  const a = hash(ix, iy, seed);
  const b = hash(ix + 1, iy, seed);
  const c = hash(ix, iy + 1, seed);
  const d = hash(ix + 1, iy + 1, seed);

  const u = smooth(fx);
  const v = smooth(fy);

  const top = a + (b - a) * u;
  const bottom = c + (d - c) * u;

  return top + (bottom - top) * v;
}

function fbm(x, y, seed) {
  let result = 0;
  let amplitude = 0.5;
  let frequency = 1;
  let total = 0;

  for (let i = 0; i < 4; i++) {
    result += noise(
      x * frequency,
      y * frequency,
      seed + i * 17
    ) * amplitude;

    total += amplitude;
    amplitude *= 0.5;
    frequency *= 2;
  }

  return result / total;
}

function clamp(value) {
  return Math.max(0, Math.min(255, Math.round(value)));
}

function modulo(value, size) {
  return ((value % size) + size) % size;
}

// ==================================================
// 3. ГЕНЕРАЦИЯ ИГРОВЫХ ТИПОВ КЛЕТОК
// ==================================================

// Демонстрационный генератор.
// В дальнейшем вместо него будет серверная матрица.

function getTerrainType(x, y) {
  const elevation = fbm(
    x * 0.035,
    y * 0.035,
    WORLD_SEED
  );

  const moisture = fbm(
    x * 0.045,
    y * 0.045,
    WORLD_SEED + 100
  );

  // Река
  const riverCenter =
    15 +
    Math.sin(x * 0.12) * 4 +
    Math.sin(x * 0.27) * 2;

  const riverDistance =
    Math.abs(y - riverCenter);

  if (riverDistance < 0.85) {
    return TERRAIN.WATER;
  }

  // Озёра
  const lakes = [
    { x: 23, y: 7, rx: 3.5, ry: 2.5 },
    { x: 7, y: 26, rx: 2.8, ry: 2.2 }
  ];

  for (const lake of lakes) {
    const dx = (x - lake.x) / lake.rx;
    const dy = (y - lake.y) / lake.ry;

    if (dx * dx + dy * dy < 1) {
      return TERRAIN.WATER;
    }
  }

  if (riverDistance < 1.65) {
    return TERRAIN.SAND;
  }

  for (const lake of lakes) {
    const dx = (x - lake.x) / lake.rx;
    const dy = (y - lake.y) / lake.ry;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 1.4) {
      return TERRAIN.SAND;
    }
  }

  if (elevation > 0.68) {
    return TERRAIN.MOUNTAIN;
  }

  if (moisture > 0.67) {
    return TERRAIN.FOREST;
  }

  if (moisture > 0.56) {
    return TERRAIN.SHRUB;
  }

  if (elevation < 0.34) {
    return TERRAIN.SAND;
  }

  return TERRAIN.GRASS;
}

// ==================================================
// 4. МАТРИЦА КЛЕТОК С ЗАПАСОМ ПО КРАЯМ
// ==================================================

const PADDING = 3;
const terrainCells = [];

function generateCellMap() {
  terrainCells.length = 0;

  for (let y = -PADDING; y < CELLS + PADDING; y++) {
    const row = [];

    for (let x = -PADDING; x < CELLS + PADDING; x++) {
      row.push(
        getTerrainType(
          WORLD_ORIGIN_X + x,
          WORLD_ORIGIN_Y + y
        )
      );
    }

    terrainCells.push(row);
  }
}

function getCell(worldX, worldY) {
  const localX = worldX - WORLD_ORIGIN_X;
  const localY = worldY - WORLD_ORIGIN_Y;

  const x = localX + PADDING;
  const y = localY + PADDING;

  if (
    x >= 0 &&
    x < terrainCells[0].length &&
    y >= 0 &&
    y < terrainCells.length
  ) {
    return terrainCells[y][x];
  }

  return getTerrainType(worldX, worldY);
}

// ==================================================
// 5. СОЗДАНИЕ БЕСШОВНЫХ ТЕКСТУР
// ==================================================

// У каждого биома своя палитра:
// базовый цвет, светлый и тёмный оттенки.

const PALETTES = [
  // Вода
  {
    base: [65, 132, 158],
    light: [104, 169, 184],
    dark: [43, 102, 133]
  },

  // Песок
  {
    base: [207, 180, 120],
    light: [230, 207, 154],
    dark: [179, 147, 91]
  },

  // Луг
  {
    base: [111, 158, 89],
    light: [139, 179, 106],
    dark: [83, 132, 72]
  },

  // Кустарник
  {
    base: [91, 128, 75],
    light: [122, 151, 88],
    dark: [64, 103, 65]
  },

  // Лес
  {
    base: [49, 91, 62],
    light: [76, 117, 75],
    dark: [34, 70, 50]
  },

  // Горы
  {
    base: [133, 133, 126],
    light: [166, 163, 151],
    dark: [99, 103, 101]
  }
];

// Все текстуры имеют одинаковый размер.
// Они повторяются без видимого шва.

function createBiomeTexture(type) {
  const palette = PALETTES[type];

  const canvas = document.createElement('canvas');

  canvas.width = TILE_SIZE;
  canvas.height = TILE_SIZE;

  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(
    TILE_SIZE,
    TILE_SIZE
  );

  const data = image.data;

  for (let y = 0; y < TILE_SIZE; y++) {
    for (let x = 0; x < TILE_SIZE; x++) {

      const u = x / TILE_SIZE;
      const v = y / TILE_SIZE;

      // Периодические волны.
      // Они обеспечивают согласование краёв текстуры.

      const wave1 =
        Math.sin(u * Math.PI * 6 + Math.sin(v * Math.PI * 4));

      const wave2 =
        Math.sin(v * Math.PI * 8 + Math.cos(u * Math.PI * 4));

      const wave3 =
        Math.sin((u + v) * Math.PI * 12);

      const pattern =
        wave1 * 0.35 +
        wave2 * 0.3 +
        wave3 * 0.15;

      const detail =
        Math.sin(u * Math.PI * 22) *
        Math.cos(v * Math.PI * 18) * 0.2;

      let light = pattern + detail;

      // Разные характеры поверхности.
      if (type === TERRAIN.WATER) {
        light += Math.sin(
          v * Math.PI * 20 +
          Math.sin(u * Math.PI * 6)
        ) * 0.25;
      }

      if (type === TERRAIN.SAND) {
        light += Math.sin(
          u * Math.PI * 32 +
          v * Math.PI * 13
        ) * 0.12;
      }

      if (
        type === TERRAIN.GRASS ||
        type === TERRAIN.SHRUB ||
        type === TERRAIN.FOREST
      ) {
        light += Math.sin(
          u * Math.PI * 28 +
          Math.cos(v * Math.PI * 16)
        ) * 0.15;
      }

      if (type === TERRAIN.MOUNTAIN) {
        light += Math.sin(
          (u - v) * Math.PI * 14
        ) * 0.22;
      }

      const amount = Math.max(
        -0.65,
        Math.min(0.65, light)
      );

      const index = (y * TILE_SIZE + x) * 4;

      for (let channel = 0; channel < 3; channel++) {
        const base = palette.base[channel];

        const target = amount >= 0
          ? palette.light[channel]
          : palette.dark[channel];

        const t = Math.abs(amount);

        data[index + channel] = clamp(
          base + (target - base) * t
        );
      }

      data[index + 3] = 255;
    }
  }

  ctx.putImageData(image, 0, 0);

  return canvas;
}

// Создаём шесть текстур один раз.
const biomeTextures = [];

for (let type = 0; type < 6; type++) {
  biomeTextures.push(
    createBiomeTexture(type)
  );
}

// Получаем пиксель из бесшовной текстуры.
// Координаты привязаны к мировому пространству.

const texturePixels = biomeTextures.map(canvas => {
  const ctx = canvas.getContext('2d');

  return ctx.getImageData(
    0,
    0,
    TILE_SIZE,
    TILE_SIZE
  ).data;
});

function sampleTexture(type, worldX, worldY) {
  const x = modulo(Math.floor(worldX), TILE_SIZE);
  const y = modulo(Math.floor(worldY), TILE_SIZE);

  const index = (y * TILE_SIZE + x) * 4;

  const data = texturePixels[type];

  return [
    data[index],
    data[index + 1],
    data[index + 2]
  ];
}

// ==================================================
// 6. ОРГАНИЧЕСКИЕ ГРАНИЦЫ
// ==================================================

function warpCoordinates(x, y) {
  return {
    x:
      x +
      Math.sin(
        y * 0.018 +
        Math.sin(x * 0.009) * 2.2
      ) * WARP_STRENGTH +
      Math.sin(y * 0.043 + x * 0.016) * 2.2,

    y:
      y +
      Math.sin(
        x * 0.017 +
        Math.sin(y * 0.008) * 2.1
      ) * WARP_STRENGTH +
      Math.sin(x * 0.039 - y * 0.014) * 2.2
  };
}

function smoothstep(edge0, edge1, value) {
  const t = Math.max(
    0,
    Math.min(1, (value - edge0) / (edge1 - edge0))
  );

  return t * t * (3 - 2 * t);
}

function mix(a, b, t) {
  return a + (b - a) * t;
}

// ==================================================
// 7. СМЕШИВАНИЕ ТЕКСТУР
// ==================================================

function getPixelColor(screenX, screenY) {
  const worldX =
    WORLD_ORIGIN_X * CELL_SIZE + screenX;

  const worldY =
    WORLD_ORIGIN_Y * CELL_SIZE + screenY;

  // Координаты для определения территории
  // искажаются, а координаты текстуры — нет.
  // Благодаря этому узор не плавает.

  const warped = warpCoordinates(worldX, worldY);

  const cellX = Math.floor(warped.x / CELL_SIZE);
  const cellY = Math.floor(warped.y / CELL_SIZE);

  const fx =
    warped.x / CELL_SIZE - cellX;

  const fy =
    warped.y / CELL_SIZE - cellY;

  const currentType = getCell(cellX, cellY);

  // Текстура текущего биома.
  const currentColor = sampleTexture(
    currentType,
    worldX,
    worldY
  );

  // Проверяем соседей.
  const neighbors = [
    {
      distance: fx * CELL_SIZE,
      type: getCell(cellX - 1, cellY)
    },
    {
      distance: (1 - fx) * CELL_SIZE,
      type: getCell(cellX + 1, cellY)
    },
    {
      distance: fy * CELL_SIZE,
      type: getCell(cellX, cellY - 1)
    },
    {
      distance: (1 - fy) * CELL_SIZE,
      type: getCell(cellX, cellY + 1)
    }
  ];

  let closest = null;

  for (const neighbor of neighbors) {
    if (neighbor.type === currentType) {
      continue;
    }

    if (
      closest === null ||
      neighbor.distance < closest.distance
    ) {
      closest = neighbor;
    }
  }

  if (closest === null) {
    return currentColor;
  }

  const neighborColor = sampleTexture(
    closest.type,
    worldX,
    worldY
  );

  // На самой границе оба биома дают равный вклад.
  // Чем дальше от границы, тем сильнее преобладает
  // собственная текстура клетки.

  const blend =
    0.5 * (
      1 - smoothstep(
        0,
        BLEND_WIDTH,
        closest.distance
      )
    );

  return [
    mix(currentColor[0], neighborColor[0], blend),
    mix(currentColor[1], neighborColor[1], blend),
    mix(currentColor[2], neighborColor[2], blend)
  ];
}

// ==================================================
// 8. ФИНАЛЬНЫЙ CANVAS
// ==================================================

const canvas = document.createElement('canvas');

canvas.width = SIZE;
canvas.height = SIZE;

const ctx = canvas.getContext('2d', {
  willReadFrequently: true
});

const image = ctx.createImageData(SIZE, SIZE);
const pixels = image.data;

function renderTerrain() {
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const color = getPixelColor(x, y);

      const index = (y * SIZE + x) * 4;

      pixels[index] = color[0];
      pixels[index + 1] = color[1];
      pixels[index + 2] = color[2];
      pixels[index + 3] = 255;
    }
  }

  ctx.putImageData(image, 0, 0);

  // Обновляем источник текстуры PixiJS.
  terrainTexture.source.update();
}

// ==================================================
// 9. PIXIJS 8
// ==================================================

const app = new PIXI.Application();

await app.init({
  width: SIZE,
  height: SIZE,
  backgroundColor: 0x6f9e59,
  antialias: true,
  resolution: Math.min(
    window.devicePixelRatio || 1,
    2
  ),
  autoDensity: true
});

document
  .getElementById('game')
  .appendChild(app.canvas);

const terrainTexture = PIXI.Texture.from(canvas);

const terrainSprite = new PIXI.Sprite(terrainTexture);

terrainSprite.width = SIZE;
terrainSprite.height = SIZE;

app.stage.addChild(terrainSprite);

const gridGraphics = new PIXI.Graphics();

app.stage.addChild(gridGraphics);

// ==================================================
// 10. СЕТКА
// ==================================================

let showGrid = false;

function drawGrid() {
  gridGraphics.clear();

  if (!showGrid) {
    return;
  }

  for (let i = 0; i <= CELLS; i++) {
    const pos = i * CELL_SIZE;

    gridGraphics
      .moveTo(pos, 0)
      .lineTo(pos, SIZE)
      .moveTo(0, pos)
      .lineTo(SIZE, pos);
  }

  gridGraphics.stroke({
    color: 0xffffff,
    alpha: 0.3,
    width: 1
  });
}

// ==================================================
// 11. ЗАПУСК
// ==================================================

function generate() {
  generateCellMap();
  renderTerrain();
  drawGrid();

  document.getElementById('status').textContent =
    `Карта ${CELLS} × ${CELLS} · Seed ${WORLD_SEED}`;
}

document
  .getElementById('generate')
  .addEventListener('click', generate);

document
  .getElementById('showGrid')
  .addEventListener('change', event => {
    showGrid = event.target.checked;
    drawGrid();
  });

generate();

</script>
</body>
</html>
